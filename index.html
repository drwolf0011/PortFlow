
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PortFlow: AI 자산관리</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2632/2632283.png">
    
    <!-- Updated Tailwind CDN to include typography plugin for Markdown rendering -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            /* Disable tap highlight color on mobile */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7fb;
            /* Prevent bounce effect on mobile */
            overscroll-behavior-y: contain;
        }

        /* Custom scrollbar for mobile */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Safe Area Utilities */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top);
        }

        /* Custom Shadows */
        .shadow-top {
            box-shadow: 0 -4px 12px -2px rgba(0, 0, 0, 0.05);
        }

        /* Animation Keyframes for UI components */
        @keyframes enter {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Utility classes matching standard tailwind-animate plugin */
        .animate-in {
            animation-duration: 0.3s;
            animation-fill-mode: forwards;
            animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        .zoom-in-95 {
            animation-name: zoomIn;
        }
        .fade-in {
            animation-name: fadeIn;
        }
        .slide-in-from-bottom {
            animation-name: slideUp;
        }
        .slide-in-from-bottom-4 {
             animation-name: slideUp;
             /* Approximate small slide */
             --tw-enter-translate-y: 1rem;
        }
        .slide-in-from-top-2 {
            animation-name: slideDown;
        }
        .duration-200 { animation-duration: 0.2s; }
        .duration-300 { animation-duration: 0.3s; }
        .duration-500 { animation-duration: 0.5s; }

        /* Core Fallback & Premium Markdown/Prose Styling for AI Reports */
        .prose {
            text-align: left;
            word-break: keep-all;
            overflow-wrap: break-word;
        }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
            color: #1e293b;
            font-weight: 800;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            line-height: 1.35;
        }
        .prose h1 { font-size: 1.4rem; border-b: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .prose h2 { font-size: 1.25rem; border-b: 1px solid #f1f5f9; padding-bottom: 0.35rem; }
        .prose h3 { font-size: 1.1rem; color: #4f46e5; margin-top: 1.25rem; } /* Indigo theme */
        .prose h4 { font-size: 1.0rem; }
        .prose p {
            margin-top: 0.5rem;
            margin-bottom: 0.875rem;
            line-height: 1.6;
            color: #334155; /* Slate-700 */
            font-size: 0.875rem;
        }
        .prose ul {
            list-style-type: disc !important;
            padding-left: 1.25rem !important;
            margin-top: 0.5rem;
            margin-bottom: 0.875rem;
        }
        .prose ol {
            list-style-type: decimal !important;
            padding-left: 1.25rem !important;
            margin-top: 0.5rem;
            margin-bottom: 0.875rem;
        }
        .prose li {
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
            line-height: 1.5;
            color: #334155;
            font-size: 0.875rem;
        }
        .prose li::marker {
            color: #6366f1; /* Beautiful Indigo bullet color */
        }
        .prose strong {
            font-weight: 700;
            color: #0f172a; /* Slate-900 */
        }
        .prose code {
            font-family: monospace;
            background-color: #f1f5f9;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.85em;
            color: #e11d48; /* code highlight */
        }
        .prose blockquote {
            border-left: 4px solid #6366f1;
            padding-left: 1rem;
            color: #475569;
            font-style: italic;
            margin: 1rem 0;
        }
        .prose hr {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin: 1.5rem 0;
        }
    </style>
